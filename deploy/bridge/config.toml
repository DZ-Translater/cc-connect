# Single-tenant, Bridge-only deployment for dianzhan.
# The bridge token is supplied by docker compose through CC_BRIDGE_TOKEN.
data_dir = "/data"
language = "zh"

[bridge]
enabled = true
port = 9810
token = "${CC_BRIDGE_TOKEN}"
path = "/bridge/ws"

# The admin gateway uses one HTTP request per turn and receives only the final
# response. Do not emit tool/thinking progress as separate Bridge replies.
[display]
mode = "quiet"

# The browser already renders its own pending state. Keeping this explicit
# prevents the first transient acknowledgement from being treated as a result.
[instant_reply]
enabled = false

[[providers]]
name = "dianzhan-claude"
api_key = "${ANTHROPIC_API_KEY}"
base_url = "${ANTHROPIC_BASE_URL}"
model = "${ANTHROPIC_MODEL}"
agent_types = ["claudecode"]

# Non-empty models is a strict allowlist. Keep upstream model discovery out of
# the Bridge UI and reject any message that requests a different model.
[[providers.models]]
model = "${ANTHROPIC_MODEL}"
alias = "default"

[[providers]]
name = "dianzhan-codex"
api_key = "${OPENAI_API_KEY}"
base_url = "${OPENAI_BASE_URL}"
model = "${CODEX_MODEL}"
agent_types = ["codex"]

# Non-empty models is a strict allowlist. Add a model here before exposing it
# through the admin UI or Bridge API.
[[providers.models]]
model = "${CODEX_MODEL}"
alias = "default"

[[providers.models]]
model = "waninter-openai/gpt-5.6-sol"
alias = "sol"

[providers.codex]
wire_api = "${CODEX_WIRE_API}"

[[projects]]
name = "dianzhan-claude"

[projects.agent]
type = "claudecode"
provider_refs = ["dianzhan-claude"]

[projects.agent.options]
work_dir = "/workspace/dianzhan"
# Fully automatic execution. Docker mounts and Linux permissions remain the
# containment boundary for the agent process.
mode = "bypassPermissions"
provider = "dianzhan-claude"

[[projects]]
name = "dianzhan-codex"

[projects.agent]
type = "codex"
provider_refs = ["dianzhan-codex"]

[projects.agent.options]
work_dir = "/workspace/dianzhan"
# Automatic edits stay in Codex's workspace-write sandbox. Do not use yolo
# unless unrestricted filesystem and network access is explicitly intended.
mode = "full-auto"
provider = "dianzhan-codex"
