name: Build and publish Bridge image

on:
  push:
    branches: [dianzhan]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/bridge/docker-compose.yml'
      - 'deploy/bridge/**'
      - 'cmd/**'
      - 'core/**'
      - 'config/**'
      - 'agent/claudecode/**'
      - 'agent/codex/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker-bridge.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Optional traceability tag. Deploy the emitted digest, never a mutable tag.
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: bridge-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/dz-translater/cc-connect-bridge

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=bridge
          cache-to: type=gha,scope=bridge,mode=max

      - name: Publish image summary
        run: |
          {
            echo '## Bridge image'
            echo
            echo "- Immutable deploy reference: \`${IMAGE_NAME}@${{ steps.build.outputs.digest }}\`"
            echo "- Traceability tag: \`${IMAGE_NAME}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}\`"
            echo '- `latest` is a convenience tag only and must not be deployed.'
          } >> "$GITHUB_STEP_SUMMARY"
