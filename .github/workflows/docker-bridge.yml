name: Build Bridge Image

on:
  push:
    branches: [dianzhan]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.bridge.yml'
      - 'deploy/bridge/**'
      - 'cmd/**'
      - 'core/**'
      - 'config/**'
      - 'agent/claudecode/**'
      - 'agent/codex/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker-bridge.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag. Leave empty to publish latest.
        required: false
        default: latest

concurrency:
  group: bridge-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag || '' }}
          IMAGE: yzg963/cc-connect-bridge
        run: |
          set -eu
          tag="${INPUT_TAG:-latest}"
          tags="${IMAGE}:${tag}"
          if [ "${tag}" != "latest" ]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "tag=${tag}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=bridge
          cache-to: type=gha,scope=bridge,mode=max

      - name: Print image references
        run: |
          printf 'Published image tags:\n%s\n' '${{ steps.meta.outputs.tags }}'
